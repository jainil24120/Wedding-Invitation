# Render Blueprint — static site, no build step
services:
  - type: web
    name: chhaya-kushal-wedding
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
